[project]
name = "mlops-hw3"
version = "0.1.0"
description = "MLOps HW3: data versioning and pipelines with DVC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
